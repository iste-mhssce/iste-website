name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-and-test:
    name: Validate, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/iste_nexus_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/iste_nexus_db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy-migrations:
    name: Deploy migrations (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-and-test
    env:
      # Migrations connect over the DIRECT (session) connection.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DIRECT_URL secret is configured
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "The DIRECT_URL secret is not configured."
            echo "Add it to Settings > Secrets and variables > Actions to enable automatic"
            echo "migration deploys. Skipping deploy-migrations."
            exit 0
          fi
          echo "DIRECT_URL secret present, proceeding with migration deploy."

      - name: Generate client
        run: npx prisma generate

      - name: Deploy migrations
        run: npx prisma migrate deploy
